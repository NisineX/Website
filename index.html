/* NiSiNEX Google Play-inspired visual refresh — presentation only */
:root{

.profile-page-head p{font-size:14px;color:#70757a;margin:0}
.profile-hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#ffffff 0%,#f7faff 55%,#eaf2ff 100%);border:1px solid #e2e9f4;border-radius:25px;padding:22px 20px 17px;margin:0 0 18px;box-shadow:0 8px 25px rgba(44,76,125,.09)}

.profile-identity{min-width:0}.profile-name{font-size:21px;font-weight:800;letter-spacing:-.4px;color:#202124;overflow-wrap:anywhere}.profile-email{font-size:13px;color:#687384;margin-top:4px;overflow-wrap:anywhere}
.profile-secure{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:11px;font-weight:700;color:#188038;background:#e8f5ec;padding:5px 9px;border-radius:20px}.profile-secure i{width:6px;height:6px;border-radius:50%;background:#188038}
.profile-divider{height:1px;background:#e6ebf2;margin:19px 0 15px}

.profile-edit-row{display:flex;gap:9px;align-items:center}.profile-edit-row input{min-width:0;flex:1;height:48px;border:1px solid #dce3ed;border-radius:13px;padding:0 13px;font-size:15px;color:#202124;background:#fff;outline:0}.profile-edit-row input:focus{border-color:#1a73e8;box-shadow:0 0 0 3px rgba(26,115,232,.10)}
.profile-save{height:46px;border:0;border-radius:13px;padding:0 17px;background:#1a73e8;color:#fff;font-size:13px;font-weight:750;white-space:nowrap;box-shadow:0 4px 10px rgba(26,115,232,.18)}
.profile-bottom-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:17px;font-size:11px;color:#7b8491}.profile-signout{border:0;background:#fff0f0;color:#c43d48;border-radius:20px;padding:8px 13px;font-size:12px;font-weight:750}

/* Follow-up polish: game tiles, compact auth controls and tactile interaction */
.game-text-mark{
  display:grid;place-items:center;flex:0 0 auto;
  background:#f1f3f4;color:#5f6368;border:1px solid #e8eaed;
  font-family:"Roboto",Arial,sans-serif;font-weight:800;letter-spacing:.7px;
  box-shadow:0 1px 2px rgba(60,64,67,.10);
}
.tile .game-text-mark{
  width:100%;height:auto;min-width:0;aspect-ratio:1;
  margin:0 0 9px;border-radius:25px;font-size:19px;
}
.row .game-text-mark{
  width:70px;height:70px;min-width:70px;flex:0 0 70px;
  border-radius:19px;font-size:14px;
}
.detailtop .game-text-mark{
  width:100px;height:100px;min-width:100px;flex:0 0 100px;
  border-radius:25px;font-size:17px;
}
.auth-switch{display:flex;align-items:center;justify-content:flex-start;gap:7px;margin:10px 0 14px}
.auth-switch button{
  flex:0 1 auto;min-width:112px;padding:8px 15px;
  font-size:13px;line-height:1.2;font-weight:700;border-radius:22px;
}
#authSubmit{
  width:auto!important;min-width:132px;padding:10px 22px;
  display:block;margin:14px auto 0;font-size:14px;
  border-radius:22px;font-weight:700;
}
.tile,.row,.appicon,.game-text-mark,.panel,.tab,.nav,.iconbtn,
.primary,.secondary,.install,.round,.back,.download-close,.side button{
  transition:transform .16s ease,background-color .16s ease,
    border-color .16s ease,box-shadow .16s ease,color .16s ease;
}
button:active,.tile:active,.row:active{
  transform:scale(.97);
}
.tile:active .appicon,.tile:active .game-text-mark,
.row:active .appicon,.row:active .game-text-mark{
  transform:scale(.96);
}
.tile:hover .appicon,.tile:hover .game-text-mark,
.row:hover .appicon,.row:hover .game-text-mark{
  box-shadow:0 3px 10px rgba(60,64,67,.15);
}
.primary:hover,.install:hover,.secondary:hover,.tab:hover,.nav:hover{
  transform:translateY(-1px);
}
@keyframes nisInexTap{0%{transform:scale(1)}45%{transform:scale(.96)}100%{transform:scale(1)}}
button:focus-visible{animation:nisInexTap .22s ease}
@media(max-width:520px){
  .detailtop .game-text-mark{width:82px;height:82px;min-width:82px;flex-basis:82px}
  .auth-switch button{min-width:0;padding:8px 13px;font-size:12px}
  #authSubmit{min-width:124px;padding:10px 19px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}

  background:#fff;border:1px solid #e8eaed;border-radius:16px;
  box-shadow:0 6px 24px rgba(60,64,67,.20);z-index:80;overflow:hidden
}

/* Unified crisp icon system — monochrome line icons */
.bottom{
  background:#f1f3f4!important;border-top:1px solid #e8eaed!important;
  box-shadow:none!important;backdrop-filter:none
}
.nav{
  color:#5f6368!important;font-size:11px;font-weight:600;
  gap:4px;min-width:66px;padding:7px 10px 5px;
  border-radius:22px
}
.nav i{
  width:46px;height:32px;border-radius:18px;
  display:grid;place-items:center;font-style:normal;
  background:transparent;color:currentColor;
  transition:background-color .18s ease,transform .18s ease,color .18s ease
}
.nav i svg{
  width:23px;height:23px;display:block;fill:none;
  stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round
}
.nav.active{color:#1967d2!important}
.nav.active i{background:#d2e3fc!important;color:#1967d2!important}
.nav:active i{transform:scale(.91)}
.nav:focus-visible{outline:none!important;outline-offset:0!important}
/* Prevent Android/WebView blue rectangular tap/focus highlight; keep icon-only scale animation */
.nav{-webkit-tap-highlight-color:transparent;tap-highlight-color:transparent;outline:none!important;box-shadow:none!important}
.nav:focus,.nav:focus-visible,.nav:active{outline:none!important;box-shadow:none!important}
.nav:active i{transform:scale(1.08)}
.appicon{
  background:#f1f3f4!important;border:1px solid #e8eaed;
  box-shadow:0 1px 3px rgba(60,64,67,.12)!important
}
.fallback{
  background:linear-gradient(145deg,#e8f0fe,#f1f3f4)!important;
  color:#1967d2!important;font-weight:700
}
.tile .appicon,.row .appicon{transition:transform .18s ease,box-shadow .18s ease}
.tile:active .appicon,.row:active .appicon{transform:scale(.95)}
@media(prefers-reduced-motion:reduce){.nav i,.appicon{transition:none!important}}


/* Header actions: identical icon size, no button box; subtle tap animation */

.headactions .iconbtn:hover,
.headactions .profile-header-btn:hover{background:transparent;color:#1967d2}
.headactions .iconbtn:active,

.headactions .iconbtn:focus-visible,

  try{

    void window.recordDownload(e,appId,appName);

    console.error("NiSiNEX download failed:",err);

 "auth/user-not-found":"No account was found with this email.",
 "auth/wrong-password":"Incorrect password. Please try again.",
 "auth/invalid-credential":"Email or password is incorrect.",
 "auth/too-many-requests":"Too many attempts. Please wait and try again.",
 "auth/network-request-failed":"Network problem. Check your internet connection.",
 "auth/operation-not-allowed":"Email/password sign-in is not enabled in Firebase Authentication."
 };return map[code]||error?.message||"Something went wrong. Please try again.";
}
window.switchAuthMode=mode=>{authMode=mode;drawAccount()};
function drawAccount(){
 const body=$("accountBody"),u=user;
 if(u){
  const name=u.displayName||u.email?.split("@")[0]||"NiSiNEX user";
  body.innerHTML=`<div class="profile-page-head"><div class="profile-kicker">ACCOUNT CENTER</div><h2>Your profile</h2><p>Manage your NiSiNEX account and downloads.</p></div>
  <div class="profile-hero"><div class="profile-hero-top"><div class="profile-avatar">${esc(name.slice(0,1).toUpperCase())}</div><div class="profile-identity"><div class="profile-name">${esc(name)}</div><div class="profile-email">${esc(u.email||"")}</div><span class="profile-secure"><i></i> Securely signed in</span></div></div><div class="profile-divider"></div><div class="profile-edit-label">DISPLAY NAME</div><div class="profile-edit-row"><input id="profileName" maxlength="40" value="${esc(name)}" aria-label="Display name"><button class="profile-save" onclick="saveProfile()" aria-label="Save profile">Save changes</button></div><div class="profile-bottom-actions"><span>Your account is active</span><button class="profile-signout" onclick="logout()">Sign out&nbsp; ↗</button></div><div id="profileMessage" class="status-note" style="display:none"></div></div>
  <div class="history-card"><div class="history-heading"><div><span class="history-kicker">YOUR ACTIVITY</span><h3>Download history</h3></div><span class="history-icon">↓</span></div><div id="history" class="muted">Loading your downloads…</div></div>`;
  loadHistory();
 }else{
  const signup=authMode==="signup";
  body.innerHTML=`<h2 style="margin:0 0 5px">${signup?"Create your account":"Welcome back"}</h2><p class="muted">${signup?"Sign up to post reviews and keep your download history.":"Sign in to access your NiSiNEX profile and activity."}</p>
  <div class="panel auth-panel"><div class="auth-switch"><button class="${signup?"primary":"secondary"}" onclick="switchAuthMode('signup')">Create account</button><button class="${!signup?"primary":"secondary"}" onclick="switchAuthMode('login')">Sign in</button></div>
  ${signup?`<div class="field"><label>Full name</label><input id="authName" autocomplete="name" maxlength="40" placeholder="Enter your name"></div><div class="field"><label>Mobile number</label><input id="authPhone" type="tel" inputmode="tel" autocomplete="tel" maxlength="18" placeholder="+8801XXXXXXXXX"></div><div class="field"><label>Email address</label><input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com"></div>`:`<div class="field"><label>Mobile number or Email</label><input id="authIdentity" autocomplete="username" placeholder="Phone number or email address"></div>`}
  <div class="field"><label>Password</label><input id="authPass" type="password" autocomplete="${signup?"new-password":"current-password"}" minlength="6" placeholder="${signup?"At least 6 characters":"Enter your password"}"></div>
  <button class="primary" id="authSubmit" style="width:100%" onclick="${signup?"signup()":"login()"}">${signup?"Create account":"Sign in"}</button>
  ${!signup?`<p style="text-align:center;margin:12px 0 0"><button class="secondary" onclick="resetPass()">Forgot password?</button></p>`:""}
  <div id="authMessage" class="status-note" style="display:none" role="status"></div></div>`;
 }
}
function setAuthMessage(message,id="authMessage"){const el=$(id);if(el){el.textContent=message;el.style.display="block"}}
function normalizePhone(value){let n=String(value||"").replace(/[\s()-]/g,"");if(n.startsWith("00"))n="+"+n.slice(2);if(n.startsWith("01")&&n.length===11)n="+88"+n;if(n.startsWith("8801")&&n.length===13)n="+"+n;return n}
function validPhone(value){return /^\+[1-9]\d{7,14}$/.test(value)}
window.signup=async()=>{
 const name=$("authName")?.value.trim()||"",email=$("authEmail")?.value.trim().toLowerCase()||"",phone=normalizePhone($("authPhone")?.value),pass=$("authPass")?.value||"",btn=$("authSubmit");
 if(name.length<2){setAuthMessage("Please enter your name (at least 2 characters).");return}
 if(!validPhone(phone)){setAuthMessage("Enter a valid mobile number, e.g. +8801XXXXXXXXX.");return}
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){setAuthMessage("Please enter a valid email address.");return}
 if(pass.length<6){setAuthMessage("Password must be at least 6 characters.");return}
 if(!btn)return;
 btn.disabled=true;btn.textContent="Creating account…";
 try{
  // Create the Firebase Authentication account first. Do not block signup
  // with an unauthenticated read from phoneLogin.
  const credential=await createUserWithEmailAndPassword(auth,email,pass);
  await updateProfile(credential.user,{displayName:name});
  user=credential.user;
  const phoneKey=phone.replace(/\D/g,""),now=Date.now();
  const profile={uid:user.uid,displayName:name,phone,email,createdAt:now,updatedAt:now,status:"active"};
  try{
   await set(ref(db,"users/"+user.uid),profile);
   await set(ref(db,"phoneLogin/"+phoneKey),{email,uid:user.uid});
  }catch(dbError){
   console.error("Firebase profile write failed:",dbError);
   setAuthMessage("Your login account was created in Firebase Authentication, but the profile could not be saved to Realtime Database. Check the Firebase Database Rules for /users and /phoneLogin. Details: "+(dbError?.message||"Permission denied."));
   return;
  }
  authMode="login";
  showToast("Account created successfully");
  drawAccount();
 }catch(e){
  console.error("NiSiNEX signup failed:",e);
  setAuthMessage(authError(e));
 }finally{
  if($("authSubmit")){$("authSubmit").disabled=false;$("authSubmit").textContent=authMode==="signup"?"Create account":"Sign in"}
 }
};
window.login=async()=>{
 const identity=$("authIdentity")?.value.trim()||"",pass=$("authPass")?.value||"",btn=$("authSubmit");
 if(!identity||!pass){setAuthMessage("Enter your mobile number or email and password.");return}
 btn.disabled=true;btn.textContent="Signing in…";
 try{
  let email=identity.toLowerCase();
  if(!identity.includes("@")){
   const phone=normalizePhone(identity);
   if(!validPhone(phone))throw Object.assign(new Error("Invalid phone number."),{code:"app/invalid-login"});
   const lookup=await get(ref(db,"phoneLogin/"+phone.replace(/\D/g,"")));
   if(!lookup.exists())throw Object.assign(new Error("No account found for this number."),{code:"app/phone-not-found"});
   email=lookup.val().email;
  }
  const credential=await signInWithEmailAndPassword(auth,email,pass);user=credential.user;
  await set(ref(db,"users/"+user.uid+"/lastLoginAt"),Date.now());
  showToast("Signed in successfully");drawAccount();
 }catch(e){setAuthMessage(authError(e))}
 finally{if($("authSubmit")){$("authSubmit").disabled=false;$("authSubmit").textContent=authMode==="signup"?"Create account":"Sign in"}}
};
window.resetPass=async()=>{
 const identity=$("authIdentity")?.value.trim()||"";
 if(!identity){setAuthMessage("Enter your registered email or mobile number first.");return}
 try{
  let email=identity.toLowerCase();
  if(!identity.includes("@")){
   const phone=normalizePhone(identity);
   if(!validPhone(phone))throw Object.assign(new Error("Enter a valid mobile number or email."),{code:"app/invalid-login"});
   const lookup=await get(ref(db,"phoneLogin/"+phone.replace(/\D/g,"")));
   if(!lookup.exists())throw Object.assign(new Error("No account found for this mobile number."),{code:"app/phone-not-found"});
   email=lookup.val().email;
  }
  await sendPasswordResetEmail(auth,email);setAuthMessage("Password reset email sent. Check your inbox.");
 }catch(e){setAuthMessage(authError(e))}
};
window.saveProfile=async()=>{
 if(!user)return;const name=$("profileName")?.value.trim()||"";
 if(name.length<2){setAuthMessage("Name must contain at least 2 characters.","profileMessage");return}
 try{
  await updateProfile(user,{displayName:name});
  await set(ref(db,"users/"+user.uid+"/displayName"),name);await set(ref(db,"users/"+user.uid+"/updatedAt"),Date.now());
  user=auth.currentUser;drawAccount();showToast("Profile updated");
 }catch(e){setAuthMessage(authError(e),"profileMessage")}
};
function loadHistory(){
 if(historyUnsubscribe){historyUnsubscribe();historyUnsubscribe=null}
 const uid=user?.uid,el=$("history");if(!uid||!el)return;
 historyUnsubscribe=onValue(ref(db,"downloads/"+uid),snapshot=>{
  const vals=Object.values(snapshot.val()||{}).sort((a,b)=>Number(b.downloadedAt||0)-Number(a.downloadedAt||0));
  el.innerHTML=vals.length?vals.map(x=>`<div class="review"><strong>${esc(x.appName||"App")}</strong><div class="muted">${x.downloadedAt?new Date(x.downloadedAt).toLocaleString():"Download recorded"}</div></div>`).join(""):"No downloads yet. Apps you install will appear here.";
 },error=>{el.textContent=error?.code==="PERMISSION_DENIED"?"Download history is blocked by the current Firebase Database Rules.":"Could not load download history."});
}
window.logout=async()=>{
 try{if(historyUnsubscribe){historyUnsubscribe();historyUnsubscribe=null}await signOut(auth);user=null;authMode="login";drawAccount();showToast("Signed out")}
 catch(e){showToast(authError(e))}
};
onAuthStateChanged(auth,u=>{user=u;subscribeUserNotifications();if($("account").classList.contains("show"))drawAccount();if(current)drawDetail()});
$("year").textContent=new Date().getFullYear();
onValue(ref(db,"publicApps"),s=>{let raw=s.val()||{};apps=Object.entries(raw).map(([id,a])=>({...a,id}));render()},e=>{console.error(e);$("appRows").innerHTML='<div class="empty">Could not connect to app store.</div>'});
</script></body></html>
